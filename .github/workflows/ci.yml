name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest

    # The persistence tests need a real PostgreSQL. tests/conftest.py only runs
    # them against a database whose name ends in _test, so the service creates
    # one with that name.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: dietbot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DIETBOT_TEST_DB_URL: postgresql://postgres@localhost:5432/dietbot_test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Lint
        run: ruff check .

      - name: Create the schema
        run: psql "$DIETBOT_TEST_DB_URL" -f sql/schema.sql

      - name: Run Tests
        run: python -m pytest -v
